services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calificador_llm
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d calificador_llm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
